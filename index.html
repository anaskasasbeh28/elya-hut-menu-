  <a class="skip" href="#menu" data-t="ui.skip"></a>

  <header class="masthead">
    <div class="band" aria-hidden="true"></div>
    <div class="wrap masthead__inner">
      <button type="button" class="lang" id="lang-toggle"></button>
      <img class="masthead__mark" src="assets/img/logo-mark.webp" width="324" height="403" alt="" decoding="async">
      <div class="plate"><h1 class="plate__name" data-t="brand.name">كُوخ إيلياء</h1></div>
      <p class="masthead__tag"><span lang="en" dir="ltr">Coffee &amp; Baked Goods</span><span aria-hidden="true">·</span><span data-t="brand.since"></span></p>
      <p class="status" id="status" role="status" hidden><span class="status__dot" aria-hidden="true"></span><span class="status__text"></span></p>
    </div>
  </header>

  <nav class="signposts" id="signposts">
    <ul class="signposts__list" id="signposts-list"></ul>
  </nav>

  <main id="menu" tabindex="-1">
    <div class="wrap">
      <p class="price-note" data-t="ui.priceNote"></p>
      <div id="sections"></div>
    </div>
  </main>

  <footer class="foot">
    <div class="band" aria-hidden="true"></div>
    <div class="wrap foot__inner">
      <div class="stamp" aria-hidden="true"><svg viewBox="0 0 386 480"><use href="#mark"/></svg></div>
      <p class="foot__welcome" data-t="brand.welcome"></p>
      <p class="foot__pets" data-t="brand.pets"></p>
      <dl class="foot__info">
        <div><dt data-t="ui.hoursLabel"></dt><dd data-t="contact.hours"></dd></div>
        <div><dt data-t="ui.addressLabel"></dt><dd data-t="contact.address"></dd></div>
      </dl>
      <div class="foot__actions">
        <a class="btn btn--primary" id="a-map" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-pin"/></svg><span data-t="ui.map"></span></a>
        <a class="btn btn--two" id="a-call"><svg aria-hidden="true"><use href="#i-phone"/></svg><span class="btn__text"><span data-t="ui.call"></span><span class="btn__num" dir="ltr" id="n-call"></span></span></a>
        <a class="btn btn--two" id="a-wa" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-chat"/></svg><span class="btn__text"><span data-t="ui.whatsapp"></span><span class="btn__num" dir="ltr" id="n-wa"></span></span></a>
      </div>
      <div class="foot__social">
        <a class="btn btn--quiet" id="a-ig" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-camera"/></svg><span data-t="ui.instagram"></span></a>
        <a class="btn btn--quiet" id="a-fb" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-link"/></svg><span data-t="ui.facebook"></span></a>
      </div>
    </div>
  </footer>

  <!-- Tap-to-view dish photo (native <dialog>: Esc, focus trap and backdrop for free) -->
  <dialog class="dish" id="dish" aria-labelledby="dish-name">
    <div class="dish__figure">
      <img class="dish__img" id="dish-img" alt="" width="1200" height="900" decoding="async">
      <button type="button" class="dish__close" id="dish-close"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div class="dish__body">
      <p class="dish__name" id="dish-name"></p>
      <p class="dish__price"><svg class="oval" viewBox="0 0 140 80" aria-hidden="true"><use href="#oval"/></svg><span class="dish__num" id="dish-num" dir="ltr"></span><span class="dish__cur" data-t="ui.currency"></span></p>
    </div>
    <div class="gingham" aria-hidden="true"></div>
  </dialog>
